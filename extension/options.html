<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Slack Cipher 設定</title><link rel="stylesheet" href="ui.css">
<body class="settings"><h1>Slack Cipher</h1><p>金鑰保存在此 Chrome 設定檔，不會同步。請透過 Slack 以外的安全管道交換單行金鑰。</p>
<button id="create">產生金鑰</button>
<label>金鑰<select id="keys" aria-label="金鑰"></select></label>
<div class="bar"><button id="export">複製選定金鑰</button><button id="delete" class="danger">移除選定金鑰</button></div>
<dialog id="delete-dialog"><p id="delete-warning"></p><p>移除後，未備份的金鑰無法復原，其歷史訊息也無法解密。建議先複製金鑰備份。</p><div class="bar"><button id="cancel-delete" class="secondary">取消</button><button id="confirm-delete" class="danger">確認移除</button></div></dialog>
<label>貼上單行金鑰<input id="import-key" type="text" autocomplete="off" spellcheck="false" placeholder="貼上 64 碼 hex 金鑰" aria-label="貼上單行金鑰"></label><button id="import">匯入金鑰</button>
<hr><h2>輸入框顯示</h2><label class="toggle"><input id="show-overlay" type="checkbox">顯示覆蓋輸入框</label><p id="overlay-state"></p><p>顯示時，可在每個輸入框內切換加密或明文送出。隱藏時恢復 Slack 原生輸入框；已有密文仍會自動解密。</p>
<button id="set-default">將選定金鑰設為預設</button><p id="default-key"></p><p id="status" role="status"></p>
<hr><h2>本次瀏覽階段的未送出草稿</h2><p>切換頻道或重新整理後，可從這裡複製回安全輸入框。關閉瀏覽器後清除。</p><div id="drafts"></div>
<p class="note">解密文字會放回 Slack 頁面，頁面程式可能讀取。第一版僅支援文字；附件與編輯訊息不受支援。匯出的金鑰文字含秘密，請妥善保存。</p>
<script type="module" src="options.js"></script></body></html>
